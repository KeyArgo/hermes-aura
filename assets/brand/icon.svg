<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Aura">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121736"/><stop offset="1" stop-color="#07091a"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1240"/><stop offset="1" stop-color="#1d1450"/></linearGradient>
    <linearGradient id="r1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fd1ff" stop-opacity="0"/><stop offset=".35" stop-color="#4fffc8" stop-opacity=".9"/><stop offset="1" stop-color="#7b6bff" stop-opacity="0"/></linearGradient>
    <linearGradient id="r2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b06bff" stop-opacity="0"/><stop offset=".4" stop-color="#b06bff" stop-opacity=".85"/><stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8ecff"/><stop offset="1" stop-color="#9fb2ff"/></linearGradient>
    <radialGradient id="spill" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fe0ff" stop-opacity=".5"/><stop offset="1" stop-color="#7b6bff" stop-opacity="0"/></radialGradient>
    <clipPath id="win"><rect x="236" y="250" width="552" height="524" rx="56"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#b)"/>
  <!-- light spilling out past the window frame -->
  <ellipse cx="512" cy="512" rx="430" ry="400" fill="url(#spill)"/>
  <!-- the window: the app you work in, with the aurora showing through -->
  <rect x="236" y="250" width="552" height="524" rx="56" fill="url(#sky)"/>
  <g clip-path="url(#win)">
    <path d="M236 760 C300 560 330 420 390 300 L470 300 C430 430 410 580 400 774Z" fill="url(#r1)"/>
    <path d="M380 774 C430 600 500 470 580 300 L660 300 C590 460 540 610 520 774Z" fill="url(#r2)"/>
    <path d="M540 774 C600 620 660 480 720 330 L788 330 L788 774Z" fill="url(#r1)" opacity=".8"/>
    <g fill="#ffffff"><circle cx="300" cy="330" r="5"/><circle cx="700" cy="300" r="4"/><circle cx="610" cy="360" r="3"/><circle cx="350" cy="400" r="3"/></g>
    <!-- the audio it breathes with -->
    <path d="M236 690 Q300 650 340 690 T444 690 T548 690 T652 690 T788 690" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="10"/>
  </g>
  <rect x="236" y="250" width="552" height="524" rx="56" fill="none" stroke="url(#frame)" stroke-width="18"/>
  <path d="M236 330h552" stroke="url(#frame)" stroke-width="12" opacity=".7"/>
  <circle cx="284" cy="290" r="13" fill="#e8ecff"/><circle cx="326" cy="290" r="13" fill="#e8ecff" fill-opacity=".6"/><circle cx="368" cy="290" r="13" fill="#e8ecff" fill-opacity=".35"/>
  <rect x="68" y="68" width="888" height="888" rx="204" fill="none" stroke="#7b6bff" stroke-width="8" opacity=".35"/>
  <path d="M842 176c-40 6-78 26-104 58 30-6 58-4 82 6-24 4-46 14-62 30 28-2 52 4 70 16-14-34-8-80 14-110Z" fill="#f2f4ff" opacity=".9"/>
</svg>
