<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:600px;overflow:hidden;background:#080a10;
    font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;color:#f4f1ea}
  .wrap{position:relative;width:1200px;height:600px;background:
    radial-gradient(90% 80% at 88% 10%,#281d4d 0%,#101426 42%,#080a10 100%)}
  .grid{position:absolute;inset:0;opacity:.16;background-image:
    linear-gradient(rgba(142,166,216,.35) 1px,transparent 1px),
    linear-gradient(90deg,rgba(142,166,216,.35) 1px,transparent 1px);
    background-size:48px 48px}
  .copy{position:absolute;left:64px;top:58px;width:410px}
  .eyebrow{font-size:12px;letter-spacing:4px;color:#8ea6d8;font-weight:600}
  h1{font-size:78px;line-height:1;margin:18px 0 10px;letter-spacing:-1.5px}
  .tag{font-size:21px;line-height:1.4;color:#e9e6f7;margin:0 0 26px}
  .rule{width:300px;height:3px;background:linear-gradient(90deg,#6ea8ff,#a78bfa,transparent);margin-bottom:24px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:12px;padding:6px 10px;border:1px solid #344070;border-radius:999px;
    color:#c9d6ff;background:rgba(20,26,48,.7)}
  .shot{position:absolute;right:52px;top:92px;width:670px;height:419px;border-radius:14px;
    border:1px solid #3a467e;box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 1px rgba(110,168,255,.18) inset;
    overflow:hidden;background:#000}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .glow{position:absolute;right:110px;top:60px;width:560px;height:480px;border-radius:50%;
    filter:blur(70px);background:radial-gradient(circle,rgba(110,168,255,.30),rgba(167,139,250,.12) 55%,transparent 72%)}
  .foot{position:absolute;left:64px;bottom:42px;font-size:13px;color:#8f9cbe}
</style></head><body><div class="wrap">
  <div class="grid"></div><div class="glow"></div>
  <div class="copy">
    <div class="eyebrow">HERMES AGENT PLUGIN · INOVINLABS</div>
    <h1>Aura</h1>
    <div class="rule"></div>
    <p class="tag">A film behind your work, and an app that breathes with your audio.</p>
    <div class="chips"><span class="chip">System loopback, never the mic</span>
      <span class="chip">140 MilkDrop presets</span><span class="chip">No account · no uploads</span></div>
  </div>
  <div class="shot"><img src="../../docs/screenshots/visualiser-page-chrome.png" alt="Aura visualiser with the skylight preset"></div>
  <div class="foot">Linux-first · PipeWire / PulseAudio · local only</div>
</div></body></html>
