name: tests

on:
  push:
  pull_request:

jobs:
  python:
    name: python suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      # The suite must prove the plugin on every OS we claim, not only the one it
      # was written on. Anything genuinely impossible per platform is skipped in
      # the test itself, with the reason written there.
      - run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/e2e --ignore=tests/integration

  desktop:
    name: desktop contract suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # EVERY tests/*.mjs file, discovered rather than listed. Two suites
      # (test_listen_desktop.mjs, test_fresh_install.mjs) crashed at import for
      # weeks because this job named one file, so CI never ran them and their
      # rot went unseen. A file that cannot even import now fails the job.
      - name: every tests/*.mjs file
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/*.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no tests/*.mjs files found - the glob is wrong" >&2
            exit 1
          fi
          printf 'running %d files:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          node --test "${files[@]}"

  manifest:
    name: manifest gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the fields the catalog reads are present
        run: |
          set -e
          grep -q '^name: aura$' plugin.yaml
          grep -q '^version: ' plugin.yaml
          grep -q '^author: ' plugin.yaml
          grep -q '^label: ' plugin.yaml
          grep -q '^description: ' plugin.yaml
          grep -q '^requires_hermes: ' plugin.yaml
          grep -q '^license: ' plugin.yaml
          echo "manifest ok"
