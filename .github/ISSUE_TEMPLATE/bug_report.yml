name: Bug report
description: Something in Aura does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove anything private (tokens, personal
        paths, audio) before attaching logs or screenshots. Security problems go
        through private vulnerability reporting, not this form.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and desktop session
      placeholder: "e.g. Fedora 41, Wayland"
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version
      description: Output of `hermes --version`.
    validations:
      required: true
  - type: input
    id: aura
    attributes:
      label: Aura version
      description: The version shown in the plugin, or `GET /api/plugins/aura/version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, personal paths and private audio first.
    validations:
      required: false
