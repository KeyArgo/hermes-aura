name: aura
label: Aura
kind: standalone
version: "1.0.1"
author: InovinLabs
description: >
  Aura plays a film, a lecture, or a YouTube playlist in the Right panel, on the Aura page, or in
  a watch window, and plays radio in that same frame. Switch the film off and the same system audio
  drives a MilkDrop-compatible visualiser in those surfaces. Per-film resume, playlist episodes
  with auto-skip of un-embeddable items, a draggable watch window, and agent moods that follow
  thinking, tool runs and approvals. Everything is analysed locally in memory from system loopback —
  never the microphone, no account, no uploads. Linux-first (PipeWire/PulseAudio); Windows unproven,
  macOS needs a virtual audio device. On after install; one click turns it off, and it stays off.
requires_hermes: ">=0.22.5"
license: MIT
provides_tools:
  - aura_control
  - aura_listen
  - aura_watch
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
  - api_request_error
  - on_stream_start
  - on_stream_end
  - subagent_start
  - subagent_stop
dashboard: dashboard
python_dependencies:
  - 'soundcard>=0.4.2,<0.5; sys_platform == "win32"'
  - 'numpy>=1.24,<3; sys_platform == "win32"'
  # macOS has no WASAPI/soundcard path: capture goes through PortAudio, i.e.
  # sounddevice against a virtual loopback device (BlackHole and friends).
  - 'sounddevice>=0.4,<0.6; sys_platform == "darwin"'
  # sounddevice's InputStream imports numpy, and Hermes core does not ship it:
  # without this a macOS install starts capture and dies on ImportError.
  - 'numpy>=1.24,<3; sys_platform == "darwin"'
